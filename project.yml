name: SportQuizApp
options:
  bundleIdPrefix: com.charlit
  deploymentTarget:
    iOS: "16.0"
targets:
  SportQuizApp:
    type: application
    platform: iOS
    sources:
      - SportQuizApp
    preBuildScripts:
      # Recopie le quiz depuis ~/Developer/sportquiz s'il existe (index.html + questions/<sport>.json, clubs.json, semaine.json, matchs.json et derbies.json -> .js).
      - name: Copier le quiz
        basedOnDependencyAnalysis: false
        script: |
          src="$SRCROOT/../sportquiz"
          dst="$SRCROOT/SportQuizApp/Game"
          [ -f "$src/index.html" ] && cp "$src/index.html" "$dst/index.html"
          # questions/<sport>.json sont la source (un fichier par sport) : on les réunit dans un script { sport: [...] }
          # (mis à jour ensuite en ligne par l'app)
          if [ -d "$src/questions" ]; then
            { printf 'const QUESTIONS = {'; sep=''
              for f in "$src"/questions/*.json; do printf '%s"%s":' "$sep" "$(basename "$f" .json)"; cat "$f"; sep=','; done
              printf '};\n'; } > "$dst/questions.js"
          fi
          [ -f "$src/clubs.json" ] && { printf 'const CLUBS = '; cat "$src/clubs.json"; printf ';\n'; } > "$dst/clubs.js"
          [ -f "$src/semaine.json" ] && { printf 'const SEMAINE = '; cat "$src/semaine.json"; printf ';\n'; } > "$dst/semaine.js"
          [ -f "$src/matchs.json" ] && { printf 'const MATCHS = '; cat "$src/matchs.json"; printf ';\n'; } > "$dst/matchs.js"
          [ -f "$src/derbies.json" ] && { printf 'const DERBIES = '; cat "$src/derbies.json"; printf ';\n'; } > "$dst/derbies.js"
          true
    info:
      path: SportQuizApp/Info.plist
      properties:
        CFBundleDisplayName: Football Quiz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Seul du HTTPS standard (téléchargement des questions) : pas de chiffrement à déclarer à chaque envoi
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Raccourcis de l'icône (appui long sur l'écran d'accueil), gérés dans SportQuizApp.swift
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.charlit.sportquiz.foot
            UIApplicationShortcutItemTitle: Spécial Foot
            UIApplicationShortcutItemIconSymbolName: soccerball
          - UIApplicationShortcutItemType: com.charlit.sportquiz.hard
            UIApplicationShortcutItemTitle: Hardcore
            UIApplicationShortcutItemIconSymbolName: flame.fill
          - UIApplicationShortcutItemType: com.charlit.sportquiz.adv
            UIApplicationShortcutItemTitle: Aventure
            UIApplicationShortcutItemIconSymbolName: map.fill
          - UIApplicationShortcutItemType: com.charlit.sportquiz.ranks
            UIApplicationShortcutItemTitle: Classement
            UIApplicationShortcutItemIconSymbolName: trophy.fill
    entitlements:
      path: SportQuizApp/SportQuizApp.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charlit.sportquiz
        # Version affichée sur l'App Store, et numéro de build à augmenter à chaque envoi à App Store Connect
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        DEVELOPMENT_TEAM: 32AK299L44
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
