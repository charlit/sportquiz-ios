name: SportQuizApp
options:
  bundleIdPrefix: com.charlit
  deploymentTarget:
    iOS: "16.0"
targets:
  SportQuizApp:
    type: application
    platform: iOS
    sources:
      - SportQuizApp
    preBuildScripts:
      # Recopie le quiz depuis ~/Developer/sportquiz s'il existe (index.html ; questions/<sport>.json, clubs.json, semaine.json, matchs.json, derbies.json et supporters.json -> .js filtrés par scripts/app-data.py).
      - name: Copier le quiz
        basedOnDependencyAnalysis: false
        script: |
          src="$SRCROOT/../sportquiz"
          dst="$SRCROOT/SportQuizApp/Game"
          [ -f "$src/index.html" ] && cp "$src/index.html" "$dst/index.html"
          # données sans Coupe du monde, FIFA, CAN ni sélections nationales (App Review 5.2.1) ; le site garde tout
          if [ -f "$src/clubs.json" ]; then /usr/bin/python3 "$SRCROOT/scripts/app-data.py" "$src" "$dst" || exit 1; fi
          true
    info:
      path: SportQuizApp/Info.plist
      properties:
        CFBundleDisplayName: Football Quiz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Seul du HTTPS standard (téléchargement des questions) : pas de chiffrement à déclarer à chaque envoi
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Raccourcis de l'icône (appui long sur l'écran d'accueil), gérés dans SportQuizApp.swift
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.charlit.sportquiz.foot
            UIApplicationShortcutItemTitle: Spécial Foot
            UIApplicationShortcutItemIconSymbolName: soccerball
          - UIApplicationShortcutItemType: com.charlit.sportquiz.hard
            UIApplicationShortcutItemTitle: Hardcore
            UIApplicationShortcutItemIconSymbolName: flame.fill
          - UIApplicationShortcutItemType: com.charlit.sportquiz.adv
            UIApplicationShortcutItemTitle: Aventure
            UIApplicationShortcutItemIconSymbolName: map.fill
          - UIApplicationShortcutItemType: com.charlit.sportquiz.ranks
            UIApplicationShortcutItemTitle: Classement
            UIApplicationShortcutItemIconSymbolName: trophy.fill
    entitlements:
      path: SportQuizApp/SportQuizApp.entitlements
      properties:
        com.apple.developer.game-center: true
        # Sauvegarde de la progression (stockage clé-valeur iCloud)
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charlit.sportquiz
        # Version affichée sur l'App Store, et numéro de build à augmenter à chaque envoi à App Store Connect
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "8"
        DEVELOPMENT_TEAM: 32AK299L44
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
