name: SportQuizApp
options:
  bundleIdPrefix: com.charlit
  deploymentTarget:
    iOS: "16.0"
targets:
  SportQuizApp:
    type: application
    platform: iOS
    sources:
      - SportQuizApp
    preBuildScripts:
      # Recopie le quiz depuis ~/Developer/sportquiz s'il existe (index.html + questions.json/clubs.json -> .js).
      - name: Copier le quiz
        basedOnDependencyAnalysis: false
        script: |
          src="$SRCROOT/../sportquiz"
          dst="$SRCROOT/SportQuizApp/Game"
          [ -f "$src/index.html" ] && cp "$src/index.html" "$dst/index.html"
          # questions.json est la source : on l'embarque sous forme de script (mis à jour ensuite en ligne par l'app)
          [ -f "$src/questions.json" ] && { printf 'const QUESTIONS = '; cat "$src/questions.json"; printf ';\n'; } > "$dst/questions.js"
          [ -f "$src/clubs.json" ] && { printf 'const CLUBS = '; cat "$src/clubs.json"; printf ';\n'; } > "$dst/clubs.js"
          true
    info:
      path: SportQuizApp/Info.plist
      properties:
        CFBundleDisplayName: Football Quiz
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: SportQuizApp/SportQuizApp.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charlit.sportquiz
        DEVELOPMENT_TEAM: 32AK299L44
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
